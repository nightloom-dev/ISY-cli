name: CI

on:
  pull_request:
  workflow_dispatch:
  # A push to main runs this from release.yml, which publishes nothing until
  # every leg here has passed.
  workflow_call:

# Called from release.yml, `github.workflow` is "Release": a pull request's run
# and main's never share a group and cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from `engines`, and the version the hooks actually run under.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # What an install gets is the tarball, not this checkout: a file left out
      # of `files`, or a dependency kept in devDependencies, passes every step
      # above and breaks both the bin and the server's imports.
      - name: Install the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/nightloom-isy-*.tgz
          ./node_modules/.bin/isy --help > /dev/null
          test "$(./node_modules/.bin/isy --version)" = "$(node -p 'require("@nightloom/isy/package.json").version')"
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const { exports } = createRequire(import.meta.url)("@nightloom/isy/package.json");
            for (const entry of Object.keys(exports).filter((e) => !e.endsWith(".json")))
              await import(`@nightloom/isy/${entry.slice(2)}`);'
